<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Join Ecosphere — Create Your Eco Profile</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(0,200,151,0.15) 0%,transparent 70%)}
    .login-box{width:100%;max-width:480px;padding:2.5rem;animation:fadeUp 0.6s ease}
    .login-logo{text-align:center;margin-bottom:2rem}
    .earth-big{font-size:4rem;animation:bounce 2.5s ease-in-out infinite;display:block;margin-bottom:0.5rem;filter:drop-shadow(0 0 20px rgba(0,200,151,0.5))}
    .login-logo h1{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
    .avatar-opt{aspect-ratio:1;border-radius:var(--radius-md);border:2px solid rgba(0,200,151,0.2);background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:var(--ease)}
    .avatar-opt:hover{border-color:var(--green);background:rgba(0,200,151,0.1);transform:scale(1.1)}
    .avatar-opt.selected{border-color:var(--green);background:rgba(0,200,151,0.2);box-shadow:0 0 14px rgba(0,200,151,0.4)}
    .success-screen{text-align:center;padding:2rem;display:flex;flex-direction:column;align-items:center;gap:1.5rem}
    .suc-avatar{font-size:5rem;animation:anim-pop 0.5s cubic-bezier(0.34,1.56,0.64,1)}
  </style>
</head>
<body>
  <div class="particle-bg"></div>
  <nav class="navbar"></nav>
  <main class="page-wrap">
    <div class="login-wrap">
      <div class="glass-card login-box" id="login-box">
        <div class="login-logo">
          <span class="earth-big">🌍</span>
          <h1>ECOSPHERE</h1>
          <p style="color:var(--text-muted);font-size:0.9rem;margin-top:4px">Your eco adventure awaits! 🌱</p>
        </div>
        <div class="tab-bar mb-3">
          <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">🔑 Login</button>
          <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">✨ Sign Up</button>
        </div>
        <!-- LOGIN -->
        <div id="form-login">
          <div class="form-group">
            <label class="form-label">🌿 Eco Name</label>
            <input class="form-input" id="login-name" type="text" placeholder="Enter your eco name..."/>
          </div>
          <div class="form-group">
            <label class="form-label">🔒 Password</label>
            <input class="form-input" id="login-pass" type="password" placeholder="Password (any for demo)"/>
          </div>
          <button class="btn btn-primary w-full mt-2" onclick="doLogin()" style="justify-content:center">🚀 Enter the Ecosphere</button>
          <p style="text-align:center;color:var(--text-muted);font-size:0.85rem;margin-top:1rem">No account? <a onclick="switchTab('signup')" style="color:var(--green);cursor:pointer;font-weight:700">Sign up free!</a></p>
        </div>
        <!-- SIGNUP -->
        <div id="form-signup" style="display:none">
          <div class="form-group">
            <label class="form-label">🌿 Choose Your Eco Name</label>
            <input class="form-input" id="signup-name" type="text" placeholder="e.g. EcoWarrior42"/>
          </div>
          <div class="form-group">
            <label class="form-label">🧑 Pick Your Avatar</label>
            <div class="avatar-grid" id="avatar-grid"></div>
          </div>
          <div class="form-group">
            <label class="form-label">🔒 Create Password</label>
            <input class="form-input" id="signup-pass" type="password" placeholder="Create a password"/>
          </div>
          <button class="btn btn-gold w-full mt-2" onclick="doSignup()" style="justify-content:center">🌱 Create My Profile</button>
          <p style="text-align:center;color:var(--text-muted);font-size:0.85rem;margin-top:1rem">Already a member? <a onclick="switchTab('login')" style="color:var(--green);cursor:pointer;font-weight:700">Log in!</a></p>
        </div>
      </div>
      <!-- SUCCESS -->
      <div class="glass-card login-box" id="success-box" style="display:none">
        <div class="success-screen">
          <span class="suc-avatar" id="suc-avatar">🌱</span>
          <div>
            <h2 style="font-family:'Orbitron',monospace;font-size:1.8rem;color:var(--green)">Welcome, <span id="suc-name"></span>!</h2>
            <p style="color:var(--text-muted);margin-top:0.5rem">You start as an <strong style="color:var(--green)">Eco Seedling 🌱</strong></p>
          </div>
          <div style="background:rgba(0,200,151,0.1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 2rem;text-align:center">
            <span style="font-size:1.5rem;font-family:'Orbitron',monospace;color:var(--gold)">+20 XP</span>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-top:4px">Welcome bonus!</p>
          </div>
          <a href="dashboard.html" class="btn btn-primary btn-lg">🏠 Go to My Dashboard</a>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
  <script>
    let selectedAvatar='🌱';
    document.addEventListener('DOMContentLoaded',()=>{
      injectNavbar('login.html');
      const grid=document.getElementById('avatar-grid');
      AVATARS.forEach(a=>{
        const d=document.createElement('div');d.className='avatar-opt'+(a===selectedAvatar?' selected':'');
        d.textContent=a;
        d.onclick=()=>{selectedAvatar=a;document.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('selected'));d.classList.add('selected')};
        grid.appendChild(d);
      });
      const s=getState();if(s.name)location.href='dashboard.html';
    });
    function switchTab(tab){
      const isLogin=tab==='login';
      document.getElementById('tab-login').classList.toggle('active',isLogin);
      document.getElementById('tab-signup').classList.toggle('active',!isLogin);
      document.getElementById('form-login').style.display=isLogin?'block':'none';
      document.getElementById('form-signup').style.display=isLogin?'none':'block';
    }
    function doLogin(){
      const name=document.getElementById('login-name').value.trim();
      if(!name){showToast('Enter your eco name!','error','⚠️');return;}
      const s=getState();s.name=name;s.avatar=s.avatar||'🌱';saveState(s);
      fireConfetti();showSuccess(name,s.avatar);
    }
    function doSignup(){
      const name=document.getElementById('signup-name').value.trim();
      if(!name||name.length<3){showToast('Name must be 3+ characters!','error','⚠️');return;}
      const ns=defaultState();ns.name=name;ns.avatar=selectedAvatar;ns.xp=XP_ACTIONS.dailyLogin;
      saveState(ns);fireConfetti();setTimeout(fireSideConfetti,400);showSuccess(name,selectedAvatar);
    }
    function showSuccess(name,avatar){
      document.getElementById('login-box').style.display='none';
      document.getElementById('success-box').style.display='block';
      document.getElementById('suc-name').textContent=name;
      document.getElementById('suc-avatar').textContent=avatar;
    }
  </script>
</body>
</html>
